description = "Mirror hashes do not match the origin's"
name = "bad_hash"
version = "1.0.0"
licenses = "MIT"
maintainers = ["any@bo.dy"]
maintainers-logins = ["someone"]

[origin]
url = "http://example.com/crate-1.0.0.tar.gz"
hashes = ["sha512:deadbeef"]

[[mirror]]
url = "http://mirror.example.com/crate-1.0.0.tar.gz"
hashes = ["sha512:beefdead"]
