description = "Sample crate"
name = "crate"
version = "1.0.0"
licenses = "MIT"
maintainers = ["any@bo.dy"]
maintainers-logins = ["someone"]

[origin]
url = "http://example.com/crate-1.0.0.tar.gz"
hashes = ["sha512:deadbeef"]

# Mirrors only give a url; the hashes are taken from the origin
[[mirror]]
url = "http://mirror1.example.com/crate-1.0.0.tar.gz"

# A mirror may even use a different archive name (same content, same hash)
[[mirror]]
url = "http://mirror2.example.com/crate-renamed.tar.gz"
