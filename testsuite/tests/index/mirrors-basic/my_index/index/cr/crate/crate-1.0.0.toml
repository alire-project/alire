description = "Sample crate"
name = "crate"
version = "1.0.0"
licenses = "MIT"
maintainers = ["any@bo.dy"]
maintainers-logins = ["someone"]

[origin]
url = "http://example.com/crate-1.0.0.tar.gz"
hashes = ["sha512:deadbeef"]

# A url-only mirror reuses the origin's hashes
[[mirror]]
url = "http://mirror1.example.com/crate-1.0.0.tar.gz"

# A mirror may redundantly repeat the matching hashes
[[mirror]]
url = "http://mirror2.example.com/crate-1.0.0.tar.gz"
hashes = ["sha512:deadbeef"]
