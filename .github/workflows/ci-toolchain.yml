name: CI self+toolchain
# Build Alire with `alr build` and using a toolchain installed from Alire
# The `alr` being tested is the one which is being submitted in the PR
# Toolchain is tested from `alr install` (1st build) and `alr build` (2nd
# build), so those are two different toolchain installations of the same
# toolchain. This way we not only test that alr builds itself, but that
# toolchain installations via `alr install` work as intented.

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.rst'
      - '**.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  gcc_versions:

    name: GCC versions

    runs-on: ubuntu-latest

    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
    - name: List GCC versions to test
      id: versions
      # Add GCC versions as they become available. Remove ones failing in
      # modern platforms, and maybe keep a representative combo in the
      # 'include' explicit section of the build job. Only the newest one runs
      # the full Python testsuite; older ones run a smoke subset (see
      # scripts/ci-github.sh).
      env:
        VERSIONS: '[12, 13, 14, 15, 16]'
      run: |
        echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
        echo "latest=$(jq max <<< "$VERSIONS")" >> $GITHUB_OUTPUT

  build:

    name: ${{ matrix.os }} gcc^${{ matrix.gcc_version }}

    needs: gcc_versions

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # We want for builds to pass on the latest stable platforms, but we
        # keep older ones for as long as they pass. No qualms on dropping older
        # platforms once they stop working.
        os:
          - macos-15-intel
          - macos-26-intel

          - macos-15
          # - macos-26 # Since runner image 20261013, its SDK's libSystem.tbd
          #            # lists arm64e.x1, which the GNAT linker rejects
          #            # ("unknown architecture"), so linking fails. Restore
          #            # (its excludes below are kept) once a fixed GNAT is out.

          # - ubuntu-22.04 # Only two legacy combs manually included below
          - ubuntu-24.04

          - windows-2022
          - windows-2025

          # - windows-11-arm # No compiler available yet

        # Versions are listed in the gcc_versions job above
        gcc_version: ${{ fromJSON(needs.gcc_versions.outputs.versions) }}

        include:
          # Only test gcc-10 and -11 on ubuntu-22.04 (to maintain testing
          # back-compatibility, as those were being tested before). Those start
          # to be quite old GCCs and we could drop them if they fail to compile
          # modern code.
          - os: ubuntu-22.04
            gcc_version: 10
          - os: ubuntu-22.04
            gcc_version: 11

          # Older macOS combos that still work somehow so we keep them.
          - os: macos-14
            gcc_version: 13
          - os: macos-14
            gcc_version: 14

        exclude:
          # Some combos are not supported due to missing pieces in the
          # toolchain or other known issues.
          - os: macos-15
            gcc_version: 12
          - os: macos-15
            gcc_version: 13
          - os: macos-15
            gcc_version: 14
          - os: macos-26
            gcc_version: 12
          - os: macos-26
            gcc_version: 13
          - os: macos-26
            gcc_version: 14
          - os: macos-15-intel
            gcc_version: 12
          - os: macos-15-intel
            gcc_version: 13
          - os: macos-15-intel
            gcc_version: 14
          - os: macos-26-intel
            gcc_version: 12
          - os: macos-26-intel
            gcc_version: 13
          - os: macos-26-intel
            gcc_version: 14

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # Use a stock alr to make the latest toolchain available

    - name: Install FSF toolchain
      uses: alire-project/alr-install@v2
      with:
        crates: gnat_native^${{matrix.gcc_version}} gprbuild

    - name: Build alr with toolchain from `alr install`
      shell: bash
      run: dev/build.sh

    # We can start using the alr we just built

    - name: Select toolchain GNAT^${{matrix.gcc_version}}
      run: >
        ./bin/alr -d -n toolchain
        --select gnat_native^${{matrix.gcc_version}} gprbuild

    - name: Show builder alr configuration
      run: ./bin/alr -d -n version

    - name: Verify proper toolchain used for 1st build
      shell: bash
      run: >
        ./bin/alr -d -n version |
        grep 'compiled with version' |
        grep -q '${{ matrix.gcc_version }}'

    - name: Update dependencies
      run: ./bin/alr -d -n -f update
      # Force because otherwise solving may time out in non-interactive mode

    - name: Show dependencies/pins
      run: >
        ./bin/alr -d -n -q with --solve ||
        ./bin/alr -n -v -d with --solve

    - name: Show build environment, with debug fallback
      run: ./bin/alr -d -n printenv || ./bin/alr -n -v -d printenv

    - name: Move ./bin to ./bin-old to allow for self-build
      shell: bash
      run: |
        mv ./bin ./bin-old || \
        { sleep 5s && mv ./bin ./bin-old && echo Old moved on 2nd attempt; }
      # Windows doesn't allow to replace a running exe so the next command
      # fails otherwise. Also, this mv fails sometimes so we try twice JIC.


    - name: SELF-BUILD
      run: ./bin-old/alr -d -n build

    - name: Show built version
      run: ./bin/alr -d -n version

    - name: Verify proper toolchain used for 2nd build
      shell: bash
      run: >
        ./bin/alr -d -n version |
        grep 'compiled with version' |
        grep -q '${{ matrix.gcc_version }}'

    # Run the testsuite with the just build alr. The testsuite picks the proper
    # alr in the ./bin/alr location.

    - name: Install Python 3.x # required by testsuite
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: pip # Downloads only; the test script installs into its own venv
        cache-dependency-path: testsuite/requirements.txt

    - name: Run testsuite 
      # But ensure a new alr is not build
      # Also run only a subset of tests that use GCC for older GCC versions
      run: >
        scripts/ci-github.sh skip_build
        ${{ matrix.gcc_version != needs.gcc_versions.outputs.latest && 'smoke_test' || '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tests that use the network run only in CI Release, to limit flakes
        ALIRE_TESTSUITE_DISABLE_NETWORK_TESTS: true
