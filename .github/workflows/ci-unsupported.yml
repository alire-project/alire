# The purpose of this CI is to run tests in a platform where there is no
# detected native package manager

name: CI unsupported

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.rst'
      - '**.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: CI on unsupported Linux

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install FSF toolchain
      uses: alire-project/alr-install@v2
      with:
        crates: gnat_native gprbuild

    - name: Install Python 3.x (required for the testsuite)
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: pip # Downloads only; the test script installs into its own venv
        cache-dependency-path: testsuite/requirements.txt

    - name: Run test script
      run: scripts/ci-github.sh
      shell: bash
      env:
        BRANCH: ${{ github.base_ref }}
        ALIRE_DISABLE_DISTRO: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tests that use the network run only in CI Release, to limit flakes
        ALIRE_TESTSUITE_DISABLE_NETWORK_TESTS: true

    - name: Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e3-log-unsupported.zip
        path: testsuite/out
